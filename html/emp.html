<!DOCTYPE html>

<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/data.css"/>
    <script type="module" src="../scripts/data.js" defer></script>
    <title>Mosher Lawms</title>
  </head>
  <body>
    <h2>Employees</h2>
    <div class="main-container">
      <div class="emp-list-section">
        <ol class="emp-list" id="emp-list">
          <li class="empty-list emp-item">No Employees</li>
        </ol>
      </div>
      <div class="emp-add-section">
        <form class="add-form" id="add-emp-form">
          <div class="top-form">
            <label for="emp-name">Name:</label>
            <input type="text" id="emp-name">
            <label for="emp-wage">Wage:$</label>
            <input type="number" id="emp-wage">
          </div>
          <hr />
          <div class="bottom-form">
            <button type="submit" id="add-emp-btn">Add</button>
            <button type="reset" id="reset-btn">Reset</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
