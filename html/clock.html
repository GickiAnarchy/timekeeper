<!DOCTYPE html>

<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="stylesheet" href="../styles/clock.css"/>
    <script type="module" src="../scripts/keyboard.mjs" defer></script>
    <script type="module" src="../scripts/clock.js" defer></script>
    <title>Mosher Lawms</title>
  </head>
  <body>
    <div class="data-section">
      <div class="top-div">
        <h3>Clock In/Out</h3>
      </div>
      <div class="dropdowns">
        <details class="employee-picker" id="employee-picker">
          <summary aria-describedby="employee-picker-help" aria-controls="employee-options">
            <span>Employees</span>
            <span id="employee-selection-count" class="employee-selection-count" aria-live="polite" aria-atomic="true">0 selected</span>
          </summary>
          <fieldset id="employee-options" class="employee-options">
            <legend class="visually-hidden">Select employees to clock in</legend>
          </fieldset>
        </details>
        <small id="employee-picker-help" class="field-hint">Choose one or more employees. Everyone selected will clock in together.</small>
        <label for="cust-select">Customer</label>
        <select id="cust-select">
          <option value="">--</option>
        </select>
      </div>
      <div class="clock-buttons">
        <button id="clock-in-button" type="button">Clock In</button>
      </div>
    </div>
    <div class="active-section">
      <h3>Active Shifts</h3>
      <p id="shift-error"></p>
      <div class="active-list-section">
        <ul id="activeShiftsList" class="shift-list">
          <li class="empty-msg">No active shifts.</li>
        </ul>
      </div>
    </div>
  </body>
  
</html>
