<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="stylesheet" href="../styles/data.css">
    <script type="module" src="../scripts/keyboard.mjs" defer></script>
    <script type="module" src="../scripts/data.js" defer></script>
    <title>People Data · Timekeeper 2.0 Skeleton</title>
  </head>
  <body>
    <header class="page-header">
      <h1>People and job sites</h1>
    </header>
    <main class="main-container">
      <p class="people-admin-note">Add or remove employees and customers used by the clock and shift history.</p>
      <details class="management-section" id="employees-section">
        <summary>Employees</summary>
        <div class="section-content">
          <div class="list-container">
            <ol class="data-list emp-list" id="emp-list"><li class="empty-list emp-item">Loading employees…</li></ol>
          </div>
          <details class="form-container add-form-disclosure">
            <summary>Add Employee</summary>
            <form class="add-form" id="add-emp-form">
              <div class="form-group">
                <label for="emp-name">Name:</label>
                <input type="text" id="emp-name" name="emp-name" autocomplete="name" required>
              </div>
              <div class="form-actions">
                <button type="submit" id="add-emp-btn" class="btn btn-primary">Add Employee</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>
            </form>
          </details>
        </div>
      </details>
      <details class="management-section" id="customers-section">
        <summary>Customers</summary>
        <div class="section-content">
          <div class="list-container">
            <ol class="data-list cust-list" id="cust-list"><li class="empty-list cust-item">Loading customers…</li></ol>
          </div>
          <details class="form-container add-form-disclosure">
            <summary>Add Customer</summary>
            <form class="add-form" id="add-cust-form">
              <div class="form-group">
                <label for="cust-name">Name:</label>
                <input type="text" id="cust-name" name="cust-name" autocomplete="organization" required>
              </div>
              <div class="form-group">
                <label for="cust-loc">Job-site location:</label>
                <input type="text" id="cust-loc" name="cust-loc" required>
              </div>
              <div class="form-group">
                <label for="cust-note">Note (optional):</label>
                <textarea id="cust-note" name="cust-note" cols="15" rows="3"></textarea>
              </div>
              <div class="form-actions">
                <button type="submit" id="add-cust-btn" class="btn btn-primary">Add Customer</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>
            </form>
          </details>
        </div>
      </details>
    </main>
  </body>
</html>
