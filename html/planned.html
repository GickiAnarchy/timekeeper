<!DOCTYPE html>

<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/planned.css"/>
    <link rel="stylesheet" href="../styles/style.css"/>
    <title>Mosher Lawms</title>
    <script type="module" src="../scripts/planned.js" defer></script>
  </head>

  <body class="planned-body">
    <div class="planned-heading-div">
      <h1>Upcoming Jobs</h1>
    </div>
    <div class="planned-control">
      <button id="add-button" class="control-button" type="button">Add Job</button>
    </div>
    <div class="planned-list-div">
      <ul id="planned-list" class="planned-list">
        
      </ul>
    </div>
    <dialog class="add-job-modal" id="add-modal">
      <h3>Add a Job</h3>
      <form class="add-form">
        <div class="top-section">
          <div class="cust-menu">
            <label for="planned-cust">Customer:</label>
            <select id="planned-cust"></select>
          </div>
          <div class="top-section">
            <label for="planned-date">Planned Date:</label>
            <input type="datetime-local" id="planned-date" />
          </div>
        </div>
        <div class="modal-buttons">
          <button type="submit" id="modal-add-button">Add</button> 
          <button type="click" id="modal-cancel-button">Cancel</button> 
        </div>
      </form>
    </dialog>
    

  </body>
  
</html>
