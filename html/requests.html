<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="stylesheet" href="../styles/requests.css">
    <script type="module" src="../scripts/keyboard.mjs" defer></script>
    <script type="module" src="../scripts/requests.js" defer></script>
    <title>Pending Requests · Timekeeper</title>
  </head>
  <body data-owner="false">
    <main class="requests-page">
      <header class="requests-heading">
        <div>
          <p class="requests-eyebrow">OWNER REVIEW</p>
          <h1>Pending requests</h1>
          <p>Guest changes remain suggestions until you approve them. Denied requests never change workspace data.</p>
        </div>
        <button type="button" class="requests-refresh" id="refresh-requests">Refresh</button>
      </header>
      <p id="requests-status" class="requests-status" role="status" aria-live="polite">Loading requests…</p>
      <ol id="requests-list" class="requests-list"></ol>
    </main>
  </body>
</html>
