<!DOCTYPE html>

<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/ledger.css"/>
    <script type="module" src="../scripts/ledger.js" defer></script>
    <title>Mosher Lawms</title>
  </head>
  <body>
    <div class="ledger-section">
      <h3><u>Employee Ledger</u></h3>
      
      <label for="ledger-emp-select">Select Employee:</label>
      <select id="ledger-emp-select"></select>

      <div id="ledger-summary" style="margin-top: 15px;">
        <p><strong>Total Earned:</strong> $<span id="total-earned">0.00</span></p>
        <p><strong>Total Paid Out:</strong> $<span id="total-paid">0.00</span></p>
        <p><strong>Remaining Owed:</strong> $<span id="balance-owed">0.00</span></p>
      </div>

      <!-- Add Payment Form -->
      <div id="payment-form" style="margin: 20px 0;">
        <h4>Record Payment</h4>
        <input type="number" id="pay-amount" placeholder="Amount ($)" step="0.01" />
        <input type="text" id="pay-note" placeholder="Note (Optional)" />
        <button type="button" id="record-pay-btn">Submit Payment</button>
      </div>

      <!-- Shifts Table -->
      <h4>Completed Shifts</h4>
      <table border="1" id="shifts-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Hours</th>
            <th>Pay</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="shifts-tbody"></tbody>
        <tfoot>
          <tr>
            <th colspan="3">Total: </th>
            <th id="total-money">$0.00</th>
          </tr>
        </tfoot>
      </table>
    </div>
  </body>
</html>
