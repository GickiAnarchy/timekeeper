<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/ledger.css"/>
    <script type="module" src="../scripts/ledger.js" defer></script>
    <title>Mosher Lawns</title>
  </head>
  <body>
    <div class="ledger-section">
      <h3><u>Employee Ledger</u></h3>
    </div>
    <div class="table-div">
      <table>
        <thead>
          <tr>
            <th>Index</th>
            <th>Date</th>
            <th>Type</th>
            <th>Hours</th>
            <th>Amount</th>
            <th  colspan="2">Notes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ledger-body">
          <!-- Rows will be added dynamically -->
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" id="ledger-total">
              <strong>Total</strong>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Form to add new ledger entry -->
    <div class="form-container">
      <form id="ledger-form">
        <label for="date">Date:</label>
        <input type="date" id="date" required>

        <label for="type">Type:</label>
        <select id="type" required>
          <option value="normal">Normal</option>
          <option value="advance">Advance</option>
        </select>

        <label for="hours">Hours:</label>
        <input type="number" id="hours" min="0" step="0.1" value="0">

        <label for="amount">Amount ($):</label>
        <input type="number" id="amount" min="0" step="0.01" value="0" disabled>

        <label for="notes">Notes:</label>
        <input type="text" id="notes" placeholder="Optional notes">

        <button type="submit">Add Entry</button>
      </form>
    </div>
  </body>
</html>
