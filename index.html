<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="./styles/style.css">
    <title>Mosher Lawns · Timekeeper</title>
    <script type="module" src="./scripts/index.js" defer></script>
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="html/home.html" target="main-content" aria-label="Mosher Lawns home">
          <span class="brand-mark"><img src="./imgs/logo_bw.jpg" alt=""></span>
          <span class="brand-copy"><strong>Mosher Lawns</strong><small>Timekeeper</small></span>
        </a>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <p class="nav-label">WORKSPACE</p>
          <button class="nav-link" type="button" data-page="html/home.html" data-title="Home" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.7 8.5-7 8.5 7v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.2h-4.4V21H4.7a1.2 1.2 0 0 1-1.2-1.2z"/></svg><span>Home</span>
          </button>

            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg><span>Clock in / out</span><span class="nav-arrow" aria-hidden="true">›</span>

          <button class="nav-link" type="button" data-page="html/invoice.html" data-title="Invoices">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-2.5-1.8-3.5 1.8-3.5-1.8L6 20.5zM9 8h6M9 12h6M9 16h3"/></svg><span>Invoices</span>

            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.5-1.2-1.6-2.8-1.8.7a7.6 7.6 0 0 0-2.6-1.5L14.6 4h-3.2l-.3 1.8a7.6 7.6 0 0 0-2.6 1.5l-1.8-.7-1.6 2.8 1.5 1.2a7.8 7.8 0 0 0 0 3l-1.5 1.2 1.6 2.8 1.8-.7a7.6 7.6 0 0 0 2.6 1.5l.3 1.8h3.2l.3-1.8a7.6 7.6 0 0 0 2.6-1.5l1.8.7 1.6-2.8z"/></svg><span>Settings</span>

        <div class="sidebar-footnote">

      <div class="app-main">

            <h1 id="active-page-title">Home</h1>
          </div>
          <div class="topbar-tools">
            <div class="topbar-date" id="topbar-date"></div>
          </div>
        </header>

        <main class="workspace-frame">
          <iframe name="main-content" title="Timekeeper workspace" src="html/home.html"></iframe>
        </main>
        <footer class="site-footer"><span>© 2026 GickiStudios</span><span>Timekeeping made simple</span></footer>
      </div>
    </div>

</html>
